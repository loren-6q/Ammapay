<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AmmaPay Timeclock</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>
    
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.7.0/dist/es-module-shims.js"></script>
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.284.0?external=react"
        }
    }
    </script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap');
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800">
    <div id="root" class="h-screen w-full flex flex-col overflow-hidden"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            LogOut, Plus, Edit, Trash2, X, DollarSign, 
            Users, FileUp, History, Play, Square, CheckCircle, AlertCircle
        } from 'lucide-react';
        
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { 
            getFirestore, collection, doc, onSnapshot, getDocs,
            updateDoc, deleteDoc, writeBatch, addDoc 
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { 
            getAuth, signInAnonymously, signInWithCustomToken
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBTagtu_DSjflsfrJjzDGUrqwQJ38up8vk",
            authDomain: "ammapay1.firebaseapp.com",
            projectId: "ammapay1",
            storageBucket: "ammapay1.firebasestorage.app",
            messagingSenderId: "878072308916",
            appId: "1:878072308916:web:fece6ce6dd3ab6b558a3e1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Fixed, permanent App ID so data is never lost across reloads or code updates
        const APP_ID = 'ammapay_caretakers';
        const STAFF_COLLECTION = 'ammastaff';
        const SHIFTS_COLLECTION = 'ammashifts';
        const ADMIN_PIN = '1234';

        const toLocalDatetimeInput = (isoString) => {
            if (!isoString) return '';
            const d = new Date(isoString);
            return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        };

        const calculatePay = (startIso, endIso, hourlyRate) => {
            if (!startIso || !endIso) return { mins: 0, formattedTime: '0h 0m', payAmount: 0 };
            const diffMs = new Date(endIso) - new Date(startIso);
            const totalMins = Math.max(0, Math.floor(diffMs / 60000));
            const hours = Math.floor(totalMins / 60);
            const mins = totalMins % 60;
            const payAmount = (totalMins / 60) * (hourlyRate || 45);
            return {
                mins: totalMins,
                formattedTime: `${hours}h ${mins}m`,
                payAmount: payAmount
            };
        };

        const formatDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : '-';
        const formatTime = (iso) => iso ? new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '-';

        function Modal({ title, children, onClose }) {
            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
                    <div className="bg-white w-full max-w-xl rounded-2xl shadow-xl overflow-hidden flex flex-col max-h-[88vh]">
                        <div className="px-5 py-3.5 bg-slate-100 border-b border-slate-200 flex justify-between items-center shrink-0">
                            <h2 className="text-xl font-extrabold uppercase text-slate-800">{title}</h2>
                            <button onClick={onClose} className="p-2 text-slate-500 hover:text-slate-800 bg-slate-200 hover:bg-slate-300 rounded-lg transition-colors">
                                <X size={20}/>
                            </button>
                        </div>
                        <div className="p-5 overflow-y-auto">
                            {children}
                        </div>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ open, title, message, confirmText = "Confirm", onConfirm, onCancel }) {
            if (!open) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/65 backdrop-blur-xs">
                    <div className="bg-white w-full max-w-sm rounded-2xl p-5 shadow-2xl space-y-4">
                        <div className="flex items-center gap-2.5 text-amber-600">
                            <AlertCircle size={28} />
                            <h3 className="text-xl font-extrabold uppercase text-slate-800">{title}</h3>
                        </div>
                        <p className="text-slate-600 font-semibold text-base leading-snug">{message}</p>
                        <div className="flex gap-3 pt-2">
                            <button onClick={onCancel} className="flex-1 py-3 bg-slate-200 hover:bg-slate-300 font-extrabold text-base text-slate-700 rounded-xl uppercase">Cancel</button>
                            <button onClick={onConfirm} className="flex-1 py-3 bg-emerald-600 hover:bg-emerald-700 font-extrabold text-base text-white rounded-xl uppercase shadow-md">{confirmText}</button>
                        </div>
                    </div>
                </div>
            );
        }

        function PinPad({ onPinComplete, errorMessage }) {
            const [pin, setPin] = useState("");

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (/^[0-9]$/.test(e.key)) {
                        setPin(prev => {
                            if (prev.length < 4) {
                                const newPin = prev + e.key;
                                if (newPin.length === 4) setTimeout(() => { onPinComplete(newPin); setPin(""); }, 120);
                                return newPin;
                            }
                            return prev;
                        });
                    } else if (e.key === 'Backspace') {
                        setPin(prev => prev.slice(0, -1));
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [onPinComplete]);
            
            const handleTap = (num) => {
                if (pin.length < 4) {
                    const newPin = pin + num;
                    setPin(newPin);
                    if (newPin.length === 4) {
                        setTimeout(() => { onPinComplete(newPin); setPin(""); }, 120);
                    }
                }
            };
            
            return (
                <div className="flex flex-col items-center justify-center w-full max-w-xs mx-auto space-y-4 my-auto px-4">
                    <div className="text-center space-y-0.5">
                        <h1 className="text-2xl font-black text-slate-800 uppercase tracking-wide">AmmaPay Timeclock</h1>
                        <p className="text-slate-500 font-bold text-sm uppercase tracking-wide">Enter 4-Digit PIN</p>
                        {errorMessage && (
                            <div className="mt-2 py-1 px-3 bg-red-100 border border-red-300 text-red-700 font-bold rounded-lg text-sm">
                                {errorMessage}
                            </div>
                        )}
                    </div>

                    <div className="flex gap-3 my-1">
                        {[0,1,2,3].map(i => (
                            <div key={i} className={`w-4 h-4 rounded-full border-2 transition-all ${i < pin.length ? 'bg-blue-600 border-blue-600' : 'border-slate-300 bg-slate-200'}`} />
                        ))}
                    </div>

                    <div className="grid grid-cols-3 gap-2.5 w-full">
                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                            <button key={num} onClick={() => handleTap(num.toString())} className="h-14 bg-white border border-slate-300 rounded-xl text-2xl font-black text-slate-800 hover:bg-slate-50 active:bg-slate-200 transition-colors flex items-center justify-center shadow-xs">
                                {num}
                            </button>
                        ))}
                        <div />
                        <button onClick={() => handleTap("0")} className="h-14 bg-white border border-slate-300 rounded-xl text-2xl font-black text-slate-800 hover:bg-slate-50 active:bg-slate-200 transition-colors flex items-center justify-center shadow-xs">
                            0
                        </button>
                        <button onClick={() => setPin(pin.slice(0, -1))} className="h-14 bg-slate-200 border border-slate-300 rounded-xl text-slate-600 hover:bg-slate-300 active:bg-slate-400 transition-colors flex items-center justify-center shadow-inner">
                            <X size={24} />
                        </button>
                    </div>
                    <p className="text-slate-400 font-semibold text-xs text-center">Use screen pad or type on keyboard</p>
                </div>
            );
        }

        function CaretakerDashboard({ user, shifts, onLogout }) {
            const [view, setView] = useState('clock');
            const [editingShift, setEditingShift] = useState(null);
            const [validationError, setValidationError] = useState('');

            const activeShift = shifts.find(s => s.staffId === user.id && !s.clockOut);
            
            const myHistory = useMemo(() => {
                const tenDaysAgo = new Date();
                tenDaysAgo.setDate(tenDaysAgo.getDate() - 10);
                return shifts
                    .filter(s => s.staffId === user.id && new Date(s.clockIn) >= tenDaysAgo)
                    .sort((a, b) => new Date(b.clockIn) - new Date(a.clockIn));
            }, [shifts, user.id]);

            const handleClockIn = async () => {
                if (activeShift) return;
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION), {
                    staffId: user.id,
                    staffName: user.name,
                    hourlyRateAtTime: user.hourlyRate || 45,
                    clockIn: new Date().toISOString(),
                    clockOut: null,
                    status: 'unpaid'
                });
            };

            const handleClockOut = async () => {
                if (!activeShift) return;
                await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION, activeShift.id), {
                    clockOut: new Date().toISOString()
                });
            };

            const handleSaveEdit = async (e) => {
                e.preventDefault();
                setValidationError('');
                const fd = new FormData(e.target);
                const cin = fd.get('clockIn');
                const cout = fd.get('clockOut');
                
                if (cin) {
                    const startIso = new Date(cin).toISOString();
                    const endIso = cout ? new Date(cout).toISOString() : null;
                    
                    if (endIso && new Date(endIso) <= new Date(startIso)) {
                        setValidationError("Clock Out time cannot be before Clock In time!");
                        return;
                    }

                    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION, editingShift.id), {
                        clockIn: startIso,
                        clockOut: endIso
                    });
                    setEditingShift(null);
                }
            };

            return (
                <div className="flex flex-col h-full bg-slate-50">
                    <header className="bg-white px-5 py-3 border-b border-slate-200 flex justify-between items-center shadow-xs shrink-0">
                        <div>
                            <h1 className="text-xl font-extrabold text-slate-800">{user.name}</h1>
                            <p className="text-slate-500 font-bold text-xs uppercase tracking-wide">Caretaker Mode (${user.hourlyRate || 45}/hr)</p>
                        </div>
                        <button onClick={onLogout} className="flex items-center gap-1.5 px-3 py-2 bg-slate-200 hover:bg-slate-300 rounded-lg font-bold text-sm text-slate-700 transition-colors">
                            <LogOut size={16} /> Log Out
                        </button>
                    </header>

                    <div className="flex bg-slate-100 border-b border-slate-200 shrink-0">
                        <button onClick={() => setView('clock')} className={`flex-1 py-3 text-base font-extrabold uppercase tracking-wide border-b-2 transition-colors ${view === 'clock' ? 'border-blue-600 text-blue-600 bg-white' : 'border-transparent text-slate-500 hover:bg-slate-200'}`}>Clock In / Out</button>
                        <button onClick={() => setView('history')} className={`flex-1 py-3 text-base font-extrabold uppercase tracking-wide border-b-2 transition-colors ${view === 'history' ? 'border-blue-600 text-blue-600 bg-white' : 'border-transparent text-slate-500 hover:bg-slate-200'}`}>My Recent Shifts</button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-5 flex flex-col items-center">
                        {view === 'clock' && (
                            <div className="w-full max-w-sm mt-4">
                                {!activeShift ? (
                                    <button onClick={handleClockIn} className="w-full py-12 bg-emerald-500 hover:bg-emerald-600 text-white rounded-2xl shadow-lg active:scale-98 transition-all flex flex-col items-center justify-center gap-3 border-2 border-emerald-400">
                                        <Play size={44} className="fill-current ml-1" />
                                        <span className="text-2xl font-black tracking-wide uppercase">Clock In</span>
                                    </button>
                                ) : (
                                    <div className="w-full space-y-4">
                                        <div className="text-center bg-white p-4 rounded-xl border border-slate-200 shadow-xs">
                                            <p className="text-slate-500 font-bold uppercase tracking-wide text-xs mb-1">Clocked In At</p>
                                            <p className="text-2xl font-black text-slate-800">{formatTime(activeShift.clockIn)}</p>
                                        </div>
                                        <button onClick={handleClockOut} className="w-full py-12 bg-red-500 hover:bg-red-600 text-white rounded-2xl shadow-lg active:scale-98 transition-all flex flex-col items-center justify-center gap-3 border-2 border-red-400">
                                            <Square size={44} className="fill-current" />
                                            <span className="text-2xl font-black tracking-wide uppercase">Clock Out</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="w-full max-w-2xl space-y-3">
                                <h2 className="text-base font-extrabold text-slate-600 uppercase tracking-wide">Last 10 Days</h2>
                                {myHistory.map(shift => {
                                    const { formattedTime } = calculatePay(shift.clockIn, shift.clockOut || new Date().toISOString(), shift.hourlyRateAtTime);
                                    return (
                                        <div key={shift.id} className="bg-white rounded-xl border border-slate-200 p-4 flex flex-col sm:flex-row justify-between sm:items-center shadow-xs gap-3">
                                            <div>
                                                <div className="text-base font-bold text-slate-800">{formatDate(shift.clockIn)}</div>
                                                <div className="text-sm text-slate-500 font-medium">
                                                    {formatTime(shift.clockIn)} — {shift.clockOut ? formatTime(shift.clockOut) : 'Working Now'}
                                                </div>
                                            </div>
                                            <div className="flex items-center justify-between sm:justify-end gap-3 w-full sm:w-auto">
                                                <div className="text-left sm:text-right bg-slate-100 px-3 py-1.5 rounded-lg">
                                                    <div className="text-base font-black text-slate-700">{shift.clockOut ? formattedTime : 'Active'}</div>
                                                    <div className={`text-xs font-bold uppercase tracking-wider ${!shift.clockOut ? 'text-emerald-600' : shift.status === 'paid' ? 'text-blue-600' : 'text-slate-500'}`}>
                                                        {!shift.clockOut ? 'Working' : shift.status}
                                                    </div>
                                                </div>
                                                <button onClick={() => { setValidationError(''); setEditingShift(shift); }} className="px-3 py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-lg font-bold text-sm flex items-center gap-1 transition-colors">
                                                    <Edit size={15}/> Fix Time
                                                </button>
                                            </div>
                                        </div>
                                    );
                                })}
                                {myHistory.length === 0 && <div className="p-6 text-center font-bold text-slate-400 text-base border-2 border-dashed border-slate-200 rounded-xl">No shifts in the last 10 days.</div>}
                            </div>
                        )}
                    </div>

                    {editingShift && (
                        <Modal title="Fix Shift Times" onClose={() => setEditingShift(null)}>
                            <form onSubmit={handleSaveEdit} className="space-y-4">
                                {validationError && (
                                    <div className="p-2.5 bg-red-100 border border-red-300 text-red-700 font-bold rounded-lg text-sm">
                                        {validationError}
                                    </div>
                                )}
                                <div className="bg-blue-50 p-3 rounded-lg border border-blue-200">
                                    <p className="text-sm font-bold text-blue-900">Forgot to click clock in or clock out?</p>
                                    <p className="text-xs text-blue-700 mt-0.5">Adjust your start and end times below to the exact times you worked.</p>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase text-slate-600 tracking-wide mb-1">Time Clocked In</label>
                                    <input required name="clockIn" type="datetime-local" defaultValue={toLocalDatetimeInput(editingShift.clockIn)} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-base font-bold outline-none focus:border-blue-600" />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold uppercase text-slate-600 tracking-wide mb-1">Time Clocked Out</label>
                                    <input name="clockOut" type="datetime-local" defaultValue={toLocalDatetimeInput(editingShift.clockOut)} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-base font-bold outline-none focus:border-blue-600" />
                                    <p className="text-slate-500 text-xs mt-1">Leave empty if you are still working right now.</p>
                                </div>
                                <div className="pt-2 flex gap-2">
                                    <button type="button" onClick={() => setEditingShift(null)} className="flex-1 py-2.5 bg-slate-200 hover:bg-slate-300 rounded-lg font-bold text-base text-slate-700 uppercase">Cancel</button>
                                    <button type="submit" className="flex-1 py-2.5 bg-blue-600 hover:bg-blue-700 text-white rounded-lg font-bold text-base uppercase shadow-sm">Save Fix</button>
                                </div>
                            </form>
                        </Modal>
                    )}
                </div>
            );
        }

        function AdminDashboard({ staff, shifts, onLogout }) {
            const [tab, setTab] = useState('payroll');
            const [editingStaff, setEditingStaff] = useState(null);
            const [isAddingStaff, setIsAddingStaff] = useState(false);
            const [confirmState, setConfirmState] = useState({ open: false, title: '', message: '', onConfirm: null });
            const [importNotice, setImportNotice] = useState(null);

            const payrollData = useMemo(() => {
                const map = {};
                staff.forEach(s => map[s.id] = { ...s, shifts: [], totalMins: 0, totalPay: 0 });
                
                shifts.filter(s => s.status === 'unpaid' && s.clockOut).forEach(shift => {
                    if (map[shift.staffId]) {
                        const rate = shift.hourlyRateAtTime || map[shift.staffId].hourlyRate || 45;
                        const { mins, payAmount } = calculatePay(shift.clockIn, shift.clockOut, rate);
                        map[shift.staffId].shifts.push(shift);
                        map[shift.staffId].totalMins += mins;
                        map[shift.staffId].totalPay += payAmount;
                    }
                });
                return Object.values(map).filter(d => d.shifts.length > 0);
            }, [staff, shifts]);

            const paidShifts = useMemo(() => {
                return shifts
                    .filter(s => s.status === 'paid')
                    .sort((a, b) => new Date(b.paidAt || b.clockIn) - new Date(a.paidAt || a.clockIn));
            }, [shifts]);

            const triggerMarkPaid = (staffId, shiftIds, staffName) => {
                setConfirmState({
                    open: true,
                    title: "Mark Hours as Paid",
                    message: `Are you sure you want to mark all outstanding hours for ${staffName} as PAID?`,
                    onConfirm: async () => {
                        const batch = writeBatch(db);
                        const now = new Date().toISOString();
                        shiftIds.forEach(id => {
                            batch.update(doc(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION, id), { 
                                status: 'paid',
                                paidAt: now
                            });
                        });
                        await batch.commit();
                        setConfirmState({ open: false });
                    }
                });
            };

            const triggerDeleteStaff = (id, name) => {
                setConfirmState({
                    open: true,
                    title: "Delete Caretaker",
                    message: `Are you sure you want to permanently delete ${name}? This cannot be undone.`,
                    onConfirm: async () => {
                        await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION, id));
                        setConfirmState({ open: false });
                    }
                });
            };

            const handleSaveStaff = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const data = {
                    name: fd.get('name').trim(),
                    pin: fd.get('pin').trim(),
                    hourlyRate: parseFloat(fd.get('hourlyRate')) || 45.00
                };
                
                if (editingStaff) {
                    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION, editingStaff.id), data);
                    setEditingStaff(null);
                } else {
                    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION), data);
                    setIsAddingStaff(false);
                }
            };

            const handleImport = async (e) => {
                e.preventDefault();
                const csv = e.target.csv.value.trim();
                if (!csv) return;
                const lines = csv.split('\n');
                const batch = writeBatch(db);
                let count = 0;

                lines.forEach(line => {
                    const parts = line.split(',').map(s => s.trim());
                    if (parts.length >= 3) {
                        const dateStr = parts[0];
                        const name = parts[1];
                        const hours = parseFloat(parts[2]);
                        
                        if (!isNaN(hours)) {
                            const staffMatch = staff.find(s => s.name.toLowerCase() === name.toLowerCase());
                            const staffId = staffMatch ? staffMatch.id : `legacy_${name.replace(/\s+/g, '_')}`;
                            const rate = staffMatch ? staffMatch.hourlyRate : 45;

                            const startDt = new Date(dateStr);
                            if (!isNaN(startDt.getTime())) {
                                startDt.setHours(9, 0, 0, 0);
                                const endDt = new Date(startDt.getTime() + (hours * 60 * 60000));

                                batch.set(doc(collection(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION)), {
                                    staffId,
                                    staffName: name,
                                    hourlyRateAtTime: rate,
                                    clockIn: startDt.toISOString(),
                                    clockOut: endDt.toISOString(),
                                    status: 'paid',
                                    paidAt: new Date().toISOString()
                                });
                                count++;
                            }
                        }
                    }
                });

                if (count > 0) {
                    await batch.commit();
                    setImportNotice({ type: 'success', text: `Successfully imported ${count} historical shift records.` });
                    e.target.reset();
                } else {
                    setImportNotice({ type: 'error', text: "Could not read any valid data rows. Check the format: Date, Name, Hours" });
                }
            };

            return (
                <div className="flex flex-col h-full bg-slate-50">
                    <header className="bg-slate-900 text-white px-5 py-3 flex justify-between items-center shrink-0">
                        <div>
                            <h1 className="text-xl font-extrabold uppercase tracking-wide text-emerald-400">Admin Dashboard</h1>
                            <p className="text-xs text-slate-400 font-semibold">Mom's Overview</p>
                        </div>
                        <button onClick={onLogout} className="flex items-center gap-1.5 px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg font-bold text-sm text-white transition-colors">
                            <LogOut size={16} /> Exit
                        </button>
                    </header>

                    <nav className="flex bg-white border-b border-slate-200 shrink-0 shadow-xs overflow-x-auto">
                        <button onClick={() => setTab('payroll')} className={`px-5 py-3 text-sm font-extrabold uppercase tracking-wide border-b-2 whitespace-nowrap transition-colors flex items-center gap-1.5 ${tab === 'payroll' ? 'border-emerald-600 text-emerald-700 bg-emerald-50/50' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}><DollarSign size={17}/> Unpaid Wages</button>
                        <button onClick={() => setTab('history')} className={`px-5 py-3 text-sm font-extrabold uppercase tracking-wide border-b-2 whitespace-nowrap transition-colors flex items-center gap-1.5 ${tab === 'history' ? 'border-blue-600 text-blue-700 bg-blue-50/50' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}><History size={17}/> Payment History</button>
                        <button onClick={() => setTab('staff')} className={`px-5 py-3 text-sm font-extrabold uppercase tracking-wide border-b-2 whitespace-nowrap transition-colors flex items-center gap-1.5 ${tab === 'staff' ? 'border-indigo-600 text-indigo-700 bg-indigo-50/50' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}><Users size={17}/> Manage Staff</button>
                        <button onClick={() => setTab('import')} className={`px-5 py-3 text-sm font-extrabold uppercase tracking-wide border-b-2 whitespace-nowrap transition-colors flex items-center gap-1.5 ${tab === 'import' ? 'border-amber-600 text-amber-700 bg-amber-50/50' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}><FileUp size={17}/> Import Data</button>
                    </nav>

                    <div className="flex-1 overflow-y-auto p-5 flex justify-center">
                        <div className="w-full max-w-3xl">

                            {tab === 'payroll' && (
                                <div className="space-y-4">
                                    <h2 className="text-xl font-extrabold text-slate-800 uppercase tracking-wide border-b-2 border-emerald-500 pb-1 inline-block">Unpaid Wages</h2>
                                    {payrollData.length === 0 && (
                                        <div className="p-6 text-center bg-white border border-dashed border-slate-300 rounded-xl">
                                            <p className="text-lg font-bold text-slate-500">Everyone is fully paid up!</p>
                                            <p className="text-sm text-slate-400 mt-1">There are no completed, unpaid shifts waiting right now.</p>
                                        </div>
                                    )}
                                    
                                    {payrollData.map(person => {
                                        const h = Math.floor(person.totalMins / 60);
                                        const m = person.totalMins % 60;
                                        return (
                                            <div key={person.id} className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden mb-4">
                                                <div className="p-4 border-b border-slate-100 flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-50/80 gap-3">
                                                    <div>
                                                        <h3 className="text-xl font-bold text-slate-900">{person.name}</h3>
                                                        <p className="text-slate-500 font-bold text-xs uppercase tracking-wide mt-0.5">${person.hourlyRate || 45}/hr Wage</p>
                                                    </div>
                                                    <div className="text-left sm:text-right bg-emerald-50 px-4 py-2 rounded-xl border border-emerald-200">
                                                        <div className="text-xs font-bold text-emerald-600 uppercase tracking-wider">Total Cash Owed</div>
                                                        <div className="text-2xl font-black text-emerald-700 tracking-tight">${person.totalPay.toFixed(2)}</div>
                                                        <div className="text-xs font-semibold text-emerald-600/90">{h} hours {m} mins</div>
                                                    </div>
                                                </div>
                                                <div className="p-4 bg-white divide-y divide-slate-100">
                                                    <h4 className="text-xs font-bold uppercase text-slate-400 tracking-wider mb-2">Completed Shifts:</h4>
                                                    {person.shifts.map(shift => {
                                                        const rate = shift.hourlyRateAtTime || person.hourlyRate || 45;
                                                        const { formattedTime, payAmount } = calculatePay(shift.clockIn, shift.clockOut, rate);
                                                        return (
                                                            <div key={shift.id} className="py-2.5 flex justify-between items-center text-sm">
                                                                <div>
                                                                    <div className="font-bold text-slate-800">{formatDate(shift.clockIn)}</div>
                                                                    <div className="text-xs text-slate-500 font-medium">{formatTime(shift.clockIn)} - {formatTime(shift.clockOut)}</div>
                                                                </div>
                                                                <div className="text-right">
                                                                    <div className="text-base font-bold text-slate-800">${payAmount.toFixed(2)}</div>
                                                                    <div className="text-xs font-semibold text-slate-400">{formattedTime}</div>
                                                                </div>
                                                            </div>
                                                        );
                                                    })}
                                                </div>
                                                <div className="p-4 bg-slate-50 border-t border-slate-100">
                                                    <button onClick={() => triggerMarkPaid(person.id, person.shifts.map(s => s.id), person.name)} className="w-full py-3 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl font-extrabold text-base uppercase tracking-wider shadow-sm flex items-center justify-center gap-2 transition-transform active:scale-[0.99]">
                                                        <CheckCircle size={20}/> Mark as Paid
                                                    </button>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            )}

                            {tab === 'history' && (
                                <div className="space-y-4">
                                    <h2 className="text-xl font-extrabold text-slate-800 uppercase tracking-wide border-b-2 border-blue-500 pb-1 inline-block">Payment History</h2>
                                    {paidShifts.length === 0 && <div className="p-6 text-center font-bold text-slate-400 text-base border border-dashed border-slate-300 rounded-xl">No paid shifts recorded yet.</div>}
                                    
                                    <div className="bg-white rounded-xl border border-slate-200 shadow-xs overflow-hidden">
                                        <div className="divide-y divide-slate-100">
                                            {paidShifts.map(shift => {
                                                const rate = shift.hourlyRateAtTime || 45;
                                                const { formattedTime, payAmount } = calculatePay(shift.clockIn, shift.clockOut, rate);
                                                return (
                                                    <div key={shift.id} className="p-3.5 flex flex-col sm:flex-row justify-between sm:items-center hover:bg-slate-50 transition-colors gap-2 text-sm">
                                                        <div className="flex-1">
                                                            <div className="flex items-center gap-2">
                                                                <span className="font-bold text-slate-900">{shift.staffName}</span>
                                                                <span className="bg-blue-100 text-blue-800 text-xs font-bold uppercase px-2 py-0.5 rounded tracking-wider">Paid</span>
                                                            </div>
                                                            <div className="text-xs font-medium text-slate-600 mt-0.5">{formatDate(shift.clockIn)}</div>
                                                            <div className="text-xs text-slate-400">{formatTime(shift.clockIn)} - {formatTime(shift.clockOut)}</div>
                                                        </div>
                                                        <div className="text-left sm:text-right bg-slate-100 px-3 py-1.5 rounded-lg">
                                                            <div className="text-base font-bold text-slate-800">${payAmount.toFixed(2)}</div>
                                                            <div className="text-xs font-semibold text-slate-500">{formattedTime}</div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {tab === 'staff' && (
                                <div className="space-y-4">
                                    <div className="flex justify-between items-center border-b-2 border-indigo-500 pb-1">
                                        <h2 className="text-xl font-extrabold text-slate-800 uppercase tracking-wide">Manage Staff</h2>
                                        <button onClick={() => setIsAddingStaff(true)} className="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold text-sm flex items-center gap-1.5 shadow-xs">
                                            <Plus size={16}/> Add Staff
                                        </button>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                        {staff.map(member => (
                                            <div key={member.id} className="bg-white rounded-xl border border-slate-200 shadow-xs p-4 flex flex-col justify-between">
                                                <div>
                                                    <h3 className="text-lg font-bold text-slate-900 mb-2">{member.name}</h3>
                                                    <div className="space-y-1.5 text-sm">
                                                        <div className="bg-slate-100 p-2.5 rounded-lg flex justify-between items-center">
                                                            <span className="font-bold uppercase text-slate-500 text-xs">Hourly Wage</span>
                                                            <span className="font-black text-emerald-600 text-lg">${member.hourlyRate || 45}/hr</span>
                                                        </div>
                                                        <div className="bg-slate-100 p-2.5 rounded-lg flex justify-between items-center">
                                                            <span className="font-bold uppercase text-slate-500 text-xs">Secret PIN</span>
                                                            <span className="font-black text-slate-800 text-lg tracking-widest">{member.pin}</span>
                                                        </div>
                                                    </div>
                                                </div>
                                                <div className="flex gap-2 mt-4 pt-3 border-t border-slate-100">
                                                    <button onClick={() => setEditingStaff(member)} className="flex-1 py-2 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-lg font-bold text-sm flex justify-center items-center gap-1 transition-colors">
                                                        <Edit size={15}/> Edit
                                                    </button>
                                                    <button onClick={() => triggerDeleteStaff(member.id, member.name)} className="flex-1 py-2 bg-red-100 hover:bg-red-200 text-red-700 rounded-lg font-bold text-sm flex justify-center items-center gap-1 transition-colors">
                                                        <Trash2 size={15}/> Delete
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {tab === 'import' && (
                                <div className="space-y-4 max-w-xl">
                                    <h2 className="text-xl font-extrabold text-slate-800 uppercase tracking-wide border-b-2 border-amber-500 pb-1 inline-block">Import Past Data</h2>
                                    {importNotice && (
                                        <div className={`p-3 rounded-lg font-bold text-sm border ${importNotice.type === 'success' ? 'bg-emerald-100 text-emerald-800 border-emerald-300' : 'bg-red-100 text-red-800 border-red-300'}`}>
                                            {importNotice.text}
                                        </div>
                                    )}
                                    <div className="bg-white rounded-xl border border-slate-200 shadow-xs p-5">
                                        <p className="text-sm font-medium text-slate-600 mb-3">
                                            Paste historical rows below in format: <strong>Date, Name, Hours</strong>.
                                        </p>
                                        <div className="bg-slate-900 text-emerald-400 p-3 rounded-lg font-mono text-xs mb-4 border border-slate-800">
                                            10/10/2026, Maria, 6.5<br/>
                                            10/11/2026, John, 4
                                        </div>
                                        <form onSubmit={handleImport} className="space-y-3">
                                            <textarea name="csv" required rows="4" className="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 font-mono text-sm outline-none focus:border-amber-500" placeholder="Paste CSV data here..."></textarea>
                                            <button type="submit" className="w-full py-3 bg-amber-500 hover:bg-amber-600 text-white rounded-lg font-bold text-base uppercase tracking-wide shadow-sm flex items-center justify-center gap-2">
                                                <FileUp size={18}/> Import Data
                                            </button>
                                        </form>
                                    </div>
                                </div>
                            )}

                        </div>
                    </div>

                    {(isAddingStaff || editingStaff) && (
                        <Modal title={editingStaff ? `Edit ${editingStaff.name}` : "Add New Caretaker"} onClose={() => { setIsAddingStaff(false); setEditingStaff(null); }}>
                            <form onSubmit={handleSaveStaff} className="space-y-4">
                                <div>
                                    <label className="block text-xs font-bold uppercase text-slate-600 tracking-wide mb-1">Caretaker Name</label>
                                    <input required name="name" type="text" defaultValue={editingStaff ? editingStaff.name : ''} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-base font-bold outline-none focus:border-indigo-500" placeholder="e.g. Maria" />
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-slate-600 tracking-wide mb-1">Secret PIN (4 Digits)</label>
                                        <input required name="pin" type="text" pattern="\d{4}" maxLength="4" defaultValue={editingStaff ? editingStaff.pin : ''} className="w-full bg-slate-50 border border-slate-300 rounded-lg px-3 py-2 text-xl font-black tracking-widest text-center outline-none focus:border-indigo-500" placeholder="0000" />
                                    </div>
                                    <div>
                                        <label className="block text-xs font-bold uppercase text-slate-600 tracking-wide mb-1">Hourly Wage ($/hr)</label>
                                        <div className="relative">
                                            <span className="absolute left-3 top-2 text-lg font-bold text-slate-400">$</span>
                                            <input required name="hourlyRate" type="number" step="0.01" defaultValue={editingStaff ? editingStaff.hourlyRate : 45.00} className="w-full bg-emerald-50 text-emerald-800 border border-emerald-300 rounded-lg pl-8 pr-3 py-2 text-lg font-bold outline-none focus:border-emerald-600" />
                                        </div>
                                    </div>
                                </div>
                                <div className="pt-3 flex gap-2 border-t border-slate-100">
                                    <button type="button" onClick={() => { setIsAddingStaff(false); setEditingStaff(null); }} className="flex-1 py-2.5 bg-slate-200 hover:bg-slate-300 rounded-lg font-bold text-sm text-slate-700 uppercase">Cancel</button>
                                    <button type="submit" className="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-bold text-sm uppercase shadow-xs">Save Caretaker</button>
                                </div>
                            </form>
                        </Modal>
                    )}

                    <ConfirmModal 
                        open={confirmState.open}
                        title={confirmState.title}
                        message={confirmState.message}
                        onConfirm={confirmState.onConfirm}
                        onCancel={() => setConfirmState({ open: false })}
                    />
                </div>
            );
        }

        function App() {
            const [authLoaded, setAuthLoaded] = useState(false);
            const [user, setUser] = useState(null);
            const [staff, setStaff] = useState([]);
            const [shifts, setShifts] = useState([]);
            const [pinError, setPinError] = useState('');
            const [dbError, setDbError] = useState('');

            useEffect(() => {
                const initApp = async () => {
                    try {
                        if (!auth.currentUser) {
                            const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                            let signedIn = false;
                            if (token) {
                                try {
                                    await signInWithCustomToken(auth, token);
                                    signedIn = true;
                                } catch (tokenErr) {
                                    console.warn("Custom token mismatch; falling back to anonymous auth:", tokenErr);
                                }
                            }
                            if (!signedIn) {
                                await signInAnonymously(auth);
                            }
                        }
                        
                        // Check for any data stranded in previous temporary paths and migrate to permanent APP_ID
                        const candidateLegacyPaths = ['ammapay1_app'];
                        if (typeof __app_id !== 'undefined' && __app_id !== APP_ID) {
                            candidateLegacyPaths.push(__app_id);
                        }

                        for (const legacyId of candidateLegacyPaths) {
                            try {
                                const legacyStaffSnap = await getDocs(collection(db, 'artifacts', legacyId, 'public', 'data', STAFF_COLLECTION));
                                if (!legacyStaffSnap.empty) {
                                    const batch = writeBatch(db);
                                    legacyStaffSnap.forEach(d => {
                                        batch.set(doc(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION, d.id), d.data());
                                    });
                                    await batch.commit();
                                }
                                
                                const legacyShiftsSnap = await getDocs(collection(db, 'artifacts', legacyId, 'public', 'data', SHIFTS_COLLECTION));
                                if (!legacyShiftsSnap.empty) {
                                    const batch = writeBatch(db);
                                    legacyShiftsSnap.forEach(d => {
                                        batch.set(doc(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION, d.id), d.data());
                                    });
                                    await batch.commit();
                                }
                            } catch (e) {
                                // Silent fallback if candidate path is non-existent
                            }
                        }

                        // Attach realtime listeners to the permanent collections
                        onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION), (snap) => {
                            setStaff(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }, (err) => {
                            setDbError("Database Connection Issue: " + err.message);
                        });

                        onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION), (snap) => {
                            setShifts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }, (err) => {
                            setDbError("Database Connection Issue: " + err.message);
                        });

                        setAuthLoaded(true);
                    } catch (err) {
                        console.error("Firebase Init Error:", err);
                        setDbError("Database Error: " + err.message);
                        setAuthLoaded(true);
                    }
                };
                initApp();
            }, []);

            const handleLogin = (pin) => {
                setPinError('');
                if (pin === ADMIN_PIN) {
                    setUser({ role: 'admin' });
                } else {
                    const found = staff.find(s => s.pin === pin);
                    if (found) {
                        setUser({ role: 'staff', ...found });
                    } else {
                        setPinError("Invalid PIN. Please try again.");
                    }
                }
            };

            const handleLogout = () => {
                setPinError('');
                setUser(null);
            };

            if (!authLoaded) {
                return <div className="flex h-screen items-center justify-center font-bold text-lg text-slate-400 uppercase tracking-widest animate-pulse">Loading Database...</div>;
            }

            return (
                <div className="h-full w-full flex flex-col justify-center">
                    {dbError && (
                        <div className="bg-red-600 text-white p-3 font-bold text-center text-sm shrink-0">
                            {dbError}
                        </div>
                    )}
                    {!user ? (
                        <PinPad onPinComplete={handleLogin} errorMessage={pinError} />
                    ) : user.role === 'admin' ? (
                        <AdminDashboard staff={staff} shifts={shifts} onLogout={handleLogout} />
                    ) : (
                        <CaretakerDashboard user={user} shifts={shifts} onLogout={handleLogout} />
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
