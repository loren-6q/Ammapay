    {
        "imports": {

<body class="bg-slate-100 text-slate-900">
    <div id="root" class="h-screen w-full flex flex-col overflow-hidden"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useMemo, useRef } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
            LogOut, Plus, Edit, Trash2, X, DollarSign, 
            Users, FileUp, History, Play, Square, CheckCircle, AlertCircle,
            ChevronDown, ChevronUp, RotateCcw, Clock, ArrowUpDown, Filter,
            FileText, Calendar, Wallet, Check
        } from 'lucide-react';
        
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { 
            getFirestore, collection, doc, onSnapshot, getDocs,
            updateDoc, deleteDoc, writeBatch, addDoc, setDoc 
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        import { 
            getAuth, signInAnonymously, signInWithCustomToken
        } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';

        const firebaseConfig = {
            apiKey: "AIzaSyBTagtu_DSjflsfrJjzDGUrqwQJ38up8vk",
            authDomain: "ammapay1.firebaseapp.com",
            projectId: "ammapay1",
            storageBucket: "ammapay1.firebasestorage.app",
            messagingSenderId: "878072308916",
            appId: "1:878072308916:web:fece6ce6dd3ab6b558a3e1"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        // Fixed, permanent App ID so data is preserved across reloads and devices
        const APP_ID = 'ammapay_caretakers';
        const STAFF_COLLECTION = 'ammastaff';
        const SHIFTS_COLLECTION = 'ammashifts';
        const PAYMENTS_COLLECTION = 'ammapayments';
        const ADMIN_PIN = '1234';

        const toLocalDatetimeInput = (isoString) => {
            if (!isoString) return '';
            const d = new Date(isoString);
            return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
        };

        const calculateShiftEarnings = (startIso, endIso, hourlyRate) => {
            if (!startIso || !endIso) return { mins: 0, hoursDec: 0, formattedTime: '0h 0m', earned: 0 };
            const diffMs = new Date(endIso) - new Date(startIso);
            const totalMins = Math.max(0, Math.floor(diffMs / 60000));
            const hours = Math.floor(totalMins / 60);
            const mins = totalMins % 60;
            const hoursDec = totalMins / 60;
            const rate = Number(hourlyRate) || 45;
            // Exact per-minute precision
            const earned = Number(((totalMins * (rate / 60))).toFixed(2));
            return {
                mins: totalMins,
                hoursDec: hoursDec,
                formattedTime: `${hours}h ${mins}m`,
                earned: earned
            };
        };

        const formatMinutesToHours = (totalMins) => {
            const h = Math.floor(totalMins / 60);
            const m = Math.round(totalMins % 60);
            return `${h}h ${m}m`;
        };

        const formatDate = (iso) => iso ? new Date(iso).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' }) : '-';
        const formatTime = (iso) => iso ? new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : '-';

        function Modal({ title, children, onClose }) {
            const modalContentRef = useRef(null);

            useEffect(() => {
                const timer = setTimeout(() => {
                    if (modalContentRef.current) {
                        const firstInput = modalContentRef.current.querySelector('input:not([type="hidden"]):not([disabled]), textarea:not([disabled]), select:not([disabled])');
                        if (firstInput) {
                            firstInput.focus();
                            if (typeof firstInput.select === 'function' && firstInput.type !== 'datetime-local' && firstInput.type !== 'date') {
                                firstInput.select();
                            }
                        }
                    }
                }, 50);
                return () => clearTimeout(timer);
            }, []);

            return (
                <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-900/65 backdrop-blur-xs">
                    <div className="bg-white w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                        <div className="px-6 py-4 bg-slate-100 border-b border-slate-200 flex justify-between items-center shrink-0">
                            <h2 className="text-xl sm:text-2xl font-black uppercase text-slate-800 tracking-wide">{title}</h2>
                            <button onClick={onClose} className="p-2 text-slate-500 hover:text-slate-800 bg-slate-200 hover:bg-slate-300 rounded-xl transition-colors">
                                <X size={24}/>
                            </button>
                        </div>
                        <div ref={modalContentRef} className="p-6 overflow-y-auto">
                            {children}
                        </div>
                    </div>
                </div>
            );
        }

        function ConfirmModal({ open, title, message, confirmText = "Confirm", isDanger = false, onConfirm, onCancel }) {
            if (!open) return null;
            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-xs">
                    <div className="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
                        <div className={`flex items-center gap-3 ${isDanger ? 'text-red-600' : 'text-amber-600'}`}>
                            <AlertCircle size={32} />
                            <h3 className="text-2xl font-black uppercase text-slate-900">{title}</h3>
                        </div>
                        <p className="text-slate-700 font-bold text-lg leading-relaxed">{message}</p>
                        <div className="flex gap-3 pt-3">
                            <button onClick={onCancel} className="flex-1 py-3.5 bg-slate-200 hover:bg-slate-300 font-black text-lg text-slate-700 rounded-xl uppercase">Cancel</button>
                            <button onClick={onConfirm} className={`flex-1 py-3.5 ${isDanger ? 'bg-red-600 hover:bg-red-700' : 'bg-emerald-600 hover:bg-emerald-700'} font-black text-lg text-white rounded-xl uppercase shadow-md`}>{confirmText}</button>
                        </div>
                    </div>
                </div>
            );
        }

        function PinPad({ onPinComplete, errorMessage }) {
            const [pin, setPin] = useState("");

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (/^[0-9]$/.test(e.key)) {
                        setPin(prev => {
                            if (prev.length < 4) {
                                const newPin = prev + e.key;
                                if (newPin.length === 4) setTimeout(() => { onPinComplete(newPin); setPin(""); }, 120);
                                return newPin;
                            }
                            return prev;
                        });
                    } else if (e.key === 'Backspace') {
                        setPin(prev => prev.slice(0, -1));
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [onPinComplete]);
            
            const handleTap = (num) => {
                if (pin.length < 4) {
                    const newPin = pin + num;
                    setPin(newPin);
                    if (newPin.length === 4) {
                        setTimeout(() => { onPinComplete(newPin); setPin(""); }, 120);
                    }
                }
            };
            
            return (
                <div className="flex flex-col items-center justify-center w-full max-w-sm mx-auto space-y-6 my-auto px-5">
                    <div className="text-center space-y-1">
                        <h1 className="text-3xl font-black text-slate-900 uppercase tracking-wide">AmmaPay Timeclock</h1>
                        <p className="text-slate-600 font-extrabold text-base uppercase tracking-wider">Enter 4-Digit PIN</p>
                        {errorMessage && (
                            <div className="mt-2 py-2 px-4 bg-red-100 border-2 border-red-300 text-red-700 font-black rounded-xl text-base">
                                {errorMessage}
                            </div>
                        )}
                    </div>

                    <div className="flex gap-4 my-2">
                        {[0,1,2,3].map(i => (
                            <div key={i} className={`w-5 h-5 rounded-full border-2 transition-all ${i < pin.length ? 'bg-blue-600 border-blue-600 scale-110' : 'border-slate-300 bg-slate-200'}`} />
                        ))}
                    </div>

                    <div className="grid grid-cols-3 gap-3 w-full">
                        {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                            <button key={num} onClick={() => handleTap(num.toString())} className="h-16 bg-white border-2 border-slate-300 rounded-2xl text-3xl font-black text-slate-800 hover:bg-slate-50 active:bg-slate-200 transition-colors flex items-center justify-center shadow-sm">
                                {num}
                            </button>
                        ))}
                        <div />
                        <button onClick={() => handleTap("0")} className="h-16 bg-white border-2 border-slate-300 rounded-2xl text-3xl font-black text-slate-800 hover:bg-slate-50 active:bg-slate-200 transition-colors flex items-center justify-center shadow-sm">
                            0
                        </button>
                        <button onClick={() => setPin(pin.slice(0, -1))} className="h-16 bg-slate-200 border-2 border-slate-300 rounded-2xl text-slate-700 hover:bg-slate-300 active:bg-slate-400 transition-colors flex items-center justify-center shadow-inner">
                            <X size={28} />
                        </button>
                    </div>
                    <p className="text-slate-500 font-bold text-sm text-center">Use on-screen buttons or type with your keyboard</p>
                </div>
            );
        }

        function CaretakerDashboard({ user, shifts, onLogout }) {
            const [view, setView] = useState('clock');
            const [editingShift, setEditingShift] = useState(null);
            const [validationError, setValidationError] = useState('');

            const activeShift = shifts.find(s => s.staffId === user.id && !s.clockOut);
            
            const myHistory = useMemo(() => {
                const tenDaysAgo = new Date();
                tenDaysAgo.setDate(tenDaysAgo.getDate() - 10);
                return shifts
                    .filter(s => s.staffId === user.id && new Date(s.clockIn) >= tenDaysAgo)
                    .sort((a, b) => new Date(b.clockIn) - new Date(a.clockIn));
            }, [shifts, user.id]);

            const handleClockIn = async () => {
                if (activeShift) return;
                await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION), {
                    staffId: user.id,
                    staffName: user.name,
                    hourlyRateAtTime: user.hourlyRate || 45,
                    clockIn: new Date().toISOString(),
                    clockOut: null,
                    notes: '',
                    paidTowards: 0
                });
            };

            const handleClockOut = async () => {
                if (!activeShift) return;
                await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION, activeShift.id), {
                    clockOut: new Date().toISOString()
                });
            };

            const handleSaveEdit = async (e) => {
                e.preventDefault();
                setValidationError('');
                const fd = new FormData(e.target);
                const cin = fd.get('clockIn');
                const cout = fd.get('clockOut');
                const notes = fd.get('notes')?.toString().trim() || '';
                
                if (cin) {
                    const startIso = new Date(cin).toISOString();
                    const endIso = cout ? new Date(cout).toISOString() : null;
                    
                    if (endIso && new Date(endIso) <= new Date(startIso)) {
                        setValidationError("Clock Out time cannot be before Clock In time!");
                        return;
                    }

                    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION, editingShift.id), {
                        clockIn: startIso,
                        clockOut: endIso,
                        notes: notes
                    });
                    setEditingShift(null);
                }
            };

            return (
                <div className="flex flex-col h-full bg-slate-100">
                    <header className="bg-white px-6 py-4 border-b border-slate-300 flex justify-between items-center shadow-xs shrink-0">
                        <div>
                            <h1 className="text-2xl font-black text-slate-900">{user.name}</h1>
                            <p className="text-slate-600 font-extrabold text-sm uppercase tracking-wide">Caretaker Portal (${user.hourlyRate || 45}/hr)</p>
                        </div>
                        <button onClick={onLogout} className="flex items-center gap-2 px-4 py-2.5 bg-slate-200 hover:bg-slate-300 rounded-xl font-black text-base text-slate-800 transition-colors">
                            <LogOut size={18} /> Log Out
                        </button>
                    </header>

                    <div className="flex bg-slate-200 border-b border-slate-300 shrink-0">
                        <button onClick={() => setView('clock')} className={`flex-1 py-4 text-lg font-black uppercase tracking-wide border-b-4 transition-colors ${view === 'clock' ? 'border-blue-600 text-blue-600 bg-white' : 'border-transparent text-slate-600 hover:bg-slate-100'}`}>Clock In / Out</button>
                        <button onClick={() => setView('history')} className={`flex-1 py-4 text-lg font-black uppercase tracking-wide border-b-4 transition-colors ${view === 'history' ? 'border-blue-600 text-blue-600 bg-white' : 'border-transparent text-slate-600 hover:bg-slate-100'}`}>My Recent Shifts (10 Days)</button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-6 flex flex-col items-center">
                        {view === 'clock' && (
                            <div className="w-full max-w-md mt-6">
                                {!activeShift ? (
                                    <button onClick={handleClockIn} className="w-full py-14 bg-emerald-500 hover:bg-emerald-600 text-white rounded-3xl shadow-xl active:scale-98 transition-all flex flex-col items-center justify-center gap-3 border-4 border-emerald-400">
                                        <Play size={56} className="fill-current ml-2" />
                                        <span className="text-3xl font-black tracking-wide uppercase">Clock In</span>
                                    </button>
                                ) : (
                                    <div className="w-full space-y-5">
                                        <div className="text-center bg-white p-6 rounded-2xl border-2 border-slate-200 shadow-sm">
                                            <p className="text-slate-500 font-extrabold uppercase tracking-wide text-sm mb-1">Currently Clocked In At</p>
                                            <p className="text-3xl font-black text-slate-900">{formatTime(activeShift.clockIn)}</p>
                                            <p className="text-slate-500 font-bold text-sm mt-1">{formatDate(activeShift.clockIn)}</p>
                                        </div>
                                        <button onClick={handleClockOut} className="w-full py-14 bg-red-500 hover:bg-red-600 text-white rounded-3xl shadow-xl active:scale-98 transition-all flex flex-col items-center justify-center gap-3 border-4 border-red-400">
                                            <Square size={56} className="fill-current" />
                                            <span className="text-3xl font-black tracking-wide uppercase">Clock Out</span>
                                        </button>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'history' && (
                            <div className="w-full max-w-3xl space-y-4">
                                <h2 className="text-lg font-black text-slate-700 uppercase tracking-wide">Last 10 Days of Shifts</h2>
                                {myHistory.map(shift => {
                                    const { formattedTime, earned } = calculateShiftEarnings(shift.clockIn, shift.clockOut || new Date().toISOString(), shift.hourlyRateAtTime);
                                    const paidTowards = Number(shift.paidTowards || 0);
                                    const isFullyPaid = shift.clockOut && (earned - paidTowards) <= 0.01;
                                    const isPartiallyPaid = shift.clockOut && paidTowards > 0 && !isFullyPaid;

                                    return (
                                        <div key={shift.id} className="bg-white rounded-2xl border border-slate-300 p-5 shadow-sm space-y-3">
                                            <div className="flex flex-col sm:flex-row justify-between sm:items-center gap-3">
                                                <div>
                                                    <div className="text-lg font-black text-slate-900">{formatDate(shift.clockIn)}</div>
                                                    <div className="text-base text-slate-600 font-bold">
                                                        {formatTime(shift.clockIn)} — {shift.clockOut ? formatTime(shift.clockOut) : 'Working Now'}
                                                    </div>
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <div className="text-right bg-slate-100 px-4 py-2 rounded-xl">
                                                        <div className="text-lg font-black text-slate-800">{shift.clockOut ? formattedTime : 'Active'}</div>
                                                        <div className={`text-xs font-black uppercase tracking-wider ${!shift.clockOut ? 'text-emerald-600' : isFullyPaid ? 'text-blue-600' : isPartiallyPaid ? 'text-purple-600' : 'text-amber-600'}`}>
                                                            {!shift.clockOut ? 'Working' : isFullyPaid ? 'Paid' : isPartiallyPaid ? 'Partially Paid' : 'Unpaid'}
                                                        </div>
                                                    </div>
                                                    <button onClick={() => { setValidationError(''); setEditingShift(shift); }} className="px-4 py-2.5 bg-amber-100 hover:bg-amber-200 text-amber-900 rounded-xl font-black text-sm flex items-center gap-1.5 transition-colors">
                                                        <Edit size={16}/> Fix Time
                                                    </button>
                                                </div>
                                            </div>
                                            {shift.notes && (
                                                <div className="bg-slate-50 p-2.5 rounded-lg border border-slate-200 text-sm font-semibold text-slate-700 flex items-start gap-2">
                                                    <FileText size={16} className="text-slate-400 shrink-0 mt-0.5" />
                                                    <span>{shift.notes}</span>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                                {myHistory.length === 0 && <div className="p-8 text-center font-bold text-slate-400 text-lg border-2 border-dashed border-slate-300 rounded-2xl">No shifts in the last 10 days.</div>}
                            </div>
                        )}
                    </div>

                    {editingShift && (
                        <Modal title="Fix Shift Times" onClose={() => setEditingShift(null)}>
                            <form onSubmit={handleSaveEdit} className="space-y-4">
                                {validationError && (
                                    <div className="p-3 bg-red-100 border-2 border-red-300 text-red-700 font-black rounded-xl text-base">
                                        {validationError}
                                    </div>
                                )}
                                <div className="bg-blue-50 p-3.5 rounded-xl border border-blue-200">
                                    <p className="text-base font-bold text-blue-900">Forgot to clock in or out?</p>
                                    <p className="text-sm text-blue-700 mt-0.5">Adjust your start and end times below to the exact times you worked.</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-black uppercase text-slate-700 tracking-wide mb-1">Time Clocked In</label>
                                    <input autoFocus required name="clockIn" type="datetime-local" defaultValue={toLocalDatetimeInput(editingShift.clockIn)} className="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-4 py-2.5 text-lg font-bold outline-none focus:border-blue-600" />
                                </div>
                                <div>
                                    <label className="block text-sm font-black uppercase text-slate-700 tracking-wide mb-1">Time Clocked Out</label>
                                    <input name="clockOut" type="datetime-local" defaultValue={toLocalDatetimeInput(editingShift.clockOut)} className="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-4 py-2.5 text-lg font-bold outline-none focus:border-blue-600" />
                                    <p className="text-slate-500 font-medium text-xs mt-1">Leave empty if you are still working right now.</p>
                                </div>
                                <div>
                                    <label className="block text-sm font-black uppercase text-slate-700 tracking-wide mb-1">Notes (Optional)</label>
                                    <input name="notes" type="text" defaultValue={editingShift.notes || ''} placeholder="e.g. Worked half day, Left early for doctor" className="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-4 py-2.5 text-base font-bold outline-none focus:border-blue-600" />
                                </div>
                                <div className="pt-3 flex gap-3">
                                    <button type="button" onClick={() => setEditingShift(null)} className="flex-1 py-3 bg-slate-200 hover:bg-slate-300 rounded-xl font-black text-lg text-slate-700 uppercase">Cancel</button>
                                    <button type="submit" className="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black text-lg uppercase shadow-sm">Save Fix</button>
                                </div>
                            </form>
                        </Modal>
                    )}
                </div>
            );
        }

        function AdminDashboard({ staff, shifts, payments, onLogout }) {
            const [tab, setTab] = useState('payroll'); // 'payroll' | 'history' | 'staff' | 'import'
            const [staffFilter, setStaffFilter] = useState('ALL');
            const [monthFilter, setMonthFilter] = useState('ALL');
            const [sortBy, setSortBy] = useState('date_desc');
            const [historyGrouping, setHistoryGrouping] = useState('staff'); // 'staff' | 'date'
            const [expandedStaffHist, setExpandedStaffHist] = useState({});

            // Modals state
            const [editingStaff, setEditingStaff] = useState(null);
            const [isAddingStaff, setIsAddingStaff] = useState(false);
            const [editingShiftAdmin, setEditingShiftAdmin] = useState(null);
            const [editingPayment, setEditingPayment] = useState(null);
            const [payingStaffGroup, setPayingStaffGroup] = useState(null);
            const [advanceModalStaff, setAdvanceModalStaff] = useState(null);
            const [confirmState, setConfirmState] = useState({ open: false, title: '', message: '', isDanger: false, onConfirm: null });
            const [importNotice, setImportNotice] = useState(null);

            // Month list from available shifts
            const availableMonths = useMemo(() => {
                const set = new Set();
                shifts.forEach(s => {
                    if (s.clockIn) {
                        const d = new Date(s.clockIn);
                        const ym = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
                        set.add(ym);
                    }
                });
                return Array.from(set).sort().reverse();
            }, [shifts]);

            const formatYearMonth = (ym) => {
                if (ym === 'ALL') return 'All Time';
                const [y, m] = ym.split('-');
                const d = new Date(parseInt(y), parseInt(m) - 1, 1);
                return d.toLocaleDateString('en-US', { month: 'short', year: 'numeric' });
            };

            // Map shifts with strictly computed earned amounts and balances
            const processedShifts = useMemo(() => {
                return shifts.map(s => {
                    const rate = Number(s.hourlyRateAtTime) || 45;
                    const { mins, hoursDec, formattedTime, earned } = calculateShiftEarnings(s.clockIn, s.clockOut, rate);
                    const paidTowards = Number(s.paidTowards || 0);
                    // Legacy status compatibility check
                    const effectivePaidTowards = (s.status === 'paid' && paidTowards === 0 && s.clockOut) ? earned : paidTowards;
                    const remainingDue = Math.max(0, Number((earned - effectivePaidTowards).toFixed(2)));
                    const isFullyPaid = s.clockOut && remainingDue <= 0.009;
                    const isPartiallyPaid = s.clockOut && effectivePaidTowards > 0 && !isFullyPaid;

                    return {
                        ...s,
                        mins,
                        hoursDec,
                        formattedTime,
                        earnedAmount: earned,
                        effectivePaidTowards,
                        remainingDue,
                        isFullyPaid,
                        isPartiallyPaid
                    };
                });
            }, [shifts]);

            // Unpaid or partially unpaid shifts (chronological for FIFO clearing)
            const unpaidShifts = useMemo(() => {
                return processedShifts
                    .filter(s => s.clockOut && !s.isFullyPaid)
                    .sort((a, b) => new Date(a.clockIn) - new Date(b.clockIn));
            }, [processedShifts]);

            // Filtered unpaid shifts for the view
            const filteredUnpaidShifts = useMemo(() => {
                return unpaidShifts.filter(s => {
                    if (staffFilter !== 'ALL' && s.staffId !== staffFilter) return false;
                    if (monthFilter !== 'ALL') {
                        const ym = `${new Date(s.clockIn).getFullYear()}-${String(new Date(s.clockIn).getMonth() + 1).padStart(2, '0')}`;
                        if (ym !== monthFilter) return false;
                    }
                    return true;
                });
            }, [unpaidShifts, staffFilter, monthFilter]);

            // Aggregate unpaid and advance balances by staff member
            const payrollByStaff = useMemo(() => {
                const map = {};
                staff.forEach(s => {
                    if (staffFilter === 'ALL' || s.id === staffFilter) {
                        map[s.id] = { 
                            ...s, 
                            shifts: [], 
                            totalMins: 0, 
                            totalEarned: 0,
                            totalPaidTowards: 0,
                            totalRemainingDue: 0,
                            advanceBalance: Number(s.advanceBalance || s.prepaidCredit || 0)
                        };
                    }
                });

                filteredUnpaidShifts.forEach(shift => {
                    if (!map[shift.staffId]) {
                        map[shift.staffId] = {
                            id: shift.staffId,
                            name: shift.staffName || 'Unknown Staff',
                            hourlyRate: shift.hourlyRateAtTime || 45,
                            shifts: [],
                            totalMins: 0,
                            totalEarned: 0,
                            totalPaidTowards: 0,
                            totalRemainingDue: 0,
                            advanceBalance: 0
                        };
                    }
                    map[shift.staffId].shifts.push(shift);
                    map[shift.staffId].totalMins += shift.mins;
                    map[shift.staffId].totalEarned += shift.earnedAmount;
                    map[shift.staffId].totalPaidTowards += shift.effectivePaidTowards;
                    map[shift.staffId].totalRemainingDue += shift.remainingDue;
                });

                // Show members who have unpaid shifts OR an active advance balance
                return Object.values(map).filter(d => d.shifts.length > 0 || d.advanceBalance > 0);
            }, [staff, filteredUnpaidShifts, staffFilter]);

            // Aggregate summary stats
            const unpaidTotals = useMemo(() => {
                let totalMins = 0;
                let totalRemaining = 0;
                filteredUnpaidShifts.forEach(s => {
                    totalMins += s.mins;
                    totalRemaining += s.remainingDue;
                });
                return {
                    mins: totalMins,
                    dollars: totalRemaining,
                    count: filteredUnpaidShifts.length,
                    formattedHours: formatMinutesToHours(totalMins)
                };
            }, [filteredUnpaidShifts]);

            const filteredPayments = useMemo(() => {
                let list = payments.filter(p => {
                    if (staffFilter !== 'ALL' && p.staffId !== staffFilter) return false;
                    if (monthFilter !== 'ALL') {
                        const ym = `${new Date(p.timestamp).getFullYear()}-${String(new Date(p.timestamp).getMonth() + 1).padStart(2, '0')}`;
                        if (ym !== monthFilter) return false;
                    }
                    return true;
                });

                list.sort((a, b) => {
                    const timeA = new Date(a.timestamp).getTime();
                    const timeB = new Date(b.timestamp).getTime();
                    if (sortBy === 'date_asc') return timeA - timeB;
                    if (sortBy === 'date_desc') return timeB - timeA;
                    if (sortBy === 'pay_desc') return (Number(b.amount) || 0) - (Number(a.amount) || 0);
                    if (sortBy === 'pay_asc') return (Number(a.amount) || 0) - (Number(b.amount) || 0);
                    return timeB - timeA;
                });

                return list;
            }, [payments, staffFilter, monthFilter, sortBy]);

            const historyTotals = useMemo(() => {
                const totalDollars = filteredPayments.reduce((acc, p) => acc + (Number(p.amount) || 0), 0);
                return {
                    dollars: totalDollars,
                    count: filteredPayments.length
                };
            }, [filteredPayments]);

            const paymentsByStaff = useMemo(() => {
                const map = {};
                filteredPayments.forEach(p => {
                    const sid = p.staffId || 'unknown';
                    if (!map[sid]) {
                        map[sid] = {
                            staffId: sid,
                            staffName: p.staffName || 'Staff Member',
                            payments: [],
                            totalDollars: 0
                        };
                    }
                    map[sid].payments.push(p);
                    map[sid].totalDollars += (Number(p.amount) || 0);
                });
                return Object.values(map);
            }, [filteredPayments]);

            const executeProcessPayment = async (e) => {
                e.preventDefault();
                if (!payingStaffGroup) return;
                const fd = new FormData(e.target);
                const shiftWagePay = parseFloat(fd.get('shiftWagePay')) || 0;
                const repaymentWithheld = parseFloat(fd.get('repaymentAmount')) || 0;
                const paymentNote = fd.get('paymentNotes')?.toString().trim() || '';

                if (shiftWagePay <= 0 && repaymentWithheld <= 0) return;

                const targetStaffId = payingStaffGroup.staffId;
                const targetStaffName = payingStaffGroup.staffName;
                const staffDocRef = doc(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION, targetStaffId);

                // FIFO: Cascade shiftWagePay through unpaid shifts oldest to newest
                let availableForShifts = Number(shiftWagePay.toFixed(2));
                const staffUnpaidShifts = processedShifts
                    .filter(s => s.staffId === targetStaffId && s.clockOut && !s.isFullyPaid)
                    .sort((a, b) => new Date(a.clockIn) - new Date(b.clockIn));

                const batch = writeBatch(db);
                const paymentDocRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', PAYMENTS_COLLECTION));
                const appliedShiftsLog = [];

                for (const shift of staffUnpaidShifts) {
                    if (availableForShifts <= 0.009) break;

                    const currentDue = shift.remainingDue;
                    const shiftDocRef = doc(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION, shift.id);

                    if (availableForShifts >= currentDue) {
                        availableForShifts = Number((availableForShifts - currentDue).toFixed(2));
                        batch.update(shiftDocRef, {
                            paidTowards: shift.earnedAmount,
                            status: 'paid',
                            lastPaidAt: new Date().toISOString()
                        });
                        appliedShiftsLog.push({ shiftId: shift.id, appliedAmount: currentDue, date: shift.clockIn, status: 'fully_cleared' });
                    } else {
                        const newPaidTowards = Number((shift.effectivePaidTowards + availableForShifts).toFixed(2));
                        appliedShiftsLog.push({ shiftId: shift.id, appliedAmount: availableForShifts, date: shift.clockIn, status: 'partially_cleared' });
                        availableForShifts = 0;
                        batch.update(shiftDocRef, {
                            paidTowards: newPaidTowards,
                            status: 'unpaid',
                            lastPaidAt: new Date().toISOString()
                        });
                    }
                }

                // Deduct withheld repayment from advance balance
                const currentAdvance = Number(payingStaffGroup.advanceBalance || 0);
                const newAdvanceBalance = Math.max(0, Number((currentAdvance - repaymentWithheld).toFixed(2)));
                batch.update(staffDocRef, {
                    advanceBalance: newAdvanceBalance,
                    prepaidCredit: 0
                });

                // Net disbursed in cash/check = Shift Wage Paid minus Repayment Withheld
                const netDisbursed = Math.max(0, Number((shiftWagePay - repaymentWithheld).toFixed(2)));

                batch.set(paymentDocRef, {
                    type: 'wage_payout',
                    staffId: targetStaffId,
                    staffName: targetStaffName,
                    amount: netDisbursed,
                    grossWagePaid: shiftWagePay,
                    repaymentWithheld: repaymentWithheld,
                    remainingAdvanceBalance: newAdvanceBalance,
                    notes: paymentNote,
                    timestamp: new Date().toISOString(),
                    appliedShifts: appliedShiftsLog
                });

                await batch.commit();
                setPayingStaffGroup(null);
            };

            const executeGiveAdvance = async (e) => {
                e.preventDefault();
                if (!advanceModalStaff) return;
                const fd = new FormData(e.target);
                const advanceAmt = parseFloat(fd.get('advanceAmount'));
                const note = fd.get('advanceNotes')?.toString().trim() || '';

                if (isNaN(advanceAmt) || advanceAmt <= 0) return;

                const targetStaffId = advanceModalStaff.id;
                const currentAdvance = Number(advanceModalStaff.advanceBalance || 0);
                const updatedAdvance = Number((currentAdvance + advanceAmt).toFixed(2));

                const batch = writeBatch(db);
                const staffRef = doc(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION, targetStaffId);
                const paymentRef = doc(collection(db, 'artifacts', APP_ID, 'public', 'data', PAYMENTS_COLLECTION));

                batch.update(staffRef, {
                    advanceBalance: updatedAdvance
                });

                batch.set(paymentRef, {
                    type: 'advance_issued',
                    staffId: targetStaffId,
                    staffName: advanceModalStaff.name,
                    amount: advanceAmt,
                    notes: note || 'Cash Advance Given',
                    timestamp: new Date().toISOString(),
                    resultingAdvanceTotal: updatedAdvance
                });

                await batch.commit();
                setAdvanceModalStaff(null);
            };

            const triggerDeletePayment = (payment) => {
                setConfirmState({
                    open: true,
                    title: "Delete / Reverse Payment?",
                    message: `Are you sure you want to delete this payment record for ${payment.staffName}? Any shifts cleared by this payment will be marked as unpaid again.`,
                    isDanger: true,
                    confirmText: "Delete Record",
                    onConfirm: async () => {
                        const batch = writeBatch(db);

                        // If it was an advance issued, reverse the advance balance
                        if (payment.type === 'advance_issued') {
                            const member = staff.find(s => s.id === payment.staffId);
                            if (member) {
                                const revAdvance = Math.max(0, Number(((member.advanceBalance || 0) - payment.amount).toFixed(2)));
                                batch.update(doc(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION, payment.staffId), {
                                    advanceBalance: revAdvance
                                });
                            }
                        } else {
                            // Reverse applied shifts
                            if (payment.appliedShifts && Array.isArray(payment.appliedShifts)) {
                                for (const item of payment.appliedShifts) {
                                    const targetShift = processedShifts.find(s => s.id === item.shiftId);
                                    if (targetShift) {
                                        const revertedPaid = Math.max(0, Number((targetShift.effectivePaidTowards - item.appliedAmount).toFixed(2)));
                                        const shiftRef = doc(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION, item.shiftId);
                                        batch.update(shiftRef, {
                                            paidTowards: revertedPaid,
                                            status: revertedPaid >= targetShift.earnedAmount ? 'paid' : 'unpaid'
                                        });
                                    }
                                }
                            }

                            // If a repayment was withheld, restore the advance balance
                            if (payment.repaymentWithheld > 0) {
                                const member = staff.find(s => s.id === payment.staffId);
                                if (member) {
                                    const restoredAdvance = Number(((member.advanceBalance || 0) + payment.repaymentWithheld).toFixed(2));
                                    batch.update(doc(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION, payment.staffId), {
                                        advanceBalance: restoredAdvance
                                    });
                                }
                            }
                        }

                        batch.delete(doc(db, 'artifacts', APP_ID, 'public', 'data', PAYMENTS_COLLECTION, payment.id));
                        await batch.commit();
                        setConfirmState({ open: false });
                    }
                });
            };

            // Save Shift Edit in Admin
            const handleAdminSaveShift = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const cin = fd.get('clockIn');
                const cout = fd.get('clockOut');
                const rate = parseFloat(fd.get('hourlyRate')) || 45;
                const notes = fd.get('notes')?.toString().trim() || '';

                if (cin) {
                    const startIso = new Date(cin).toISOString();
                    const endIso = cout ? new Date(cout).toISOString() : null;

                    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION, editingShiftAdmin.id), {
                        clockIn: startIso,
                        clockOut: endIso,
                        hourlyRateAtTime: rate,
                        notes: notes
                    });
                    setEditingShiftAdmin(null);
                }
            };

            const triggerDeleteShift = (shiftId) => {
                setConfirmState({
                    open: true,
                    title: "Delete Shift Record",
                    message: "Are you sure you want to permanently delete this shift? This cannot be undone.",
                    isDanger: true,
                    confirmText: "Delete Shift",
                    onConfirm: async () => {
                        await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION, shiftId));
                        setEditingShiftAdmin(null);
                        setConfirmState({ open: false });
                    }
                });
            };

            const handleSaveStaff = async (e) => {
                e.preventDefault();
                const fd = new FormData(e.target);
                const data = {
                    name: fd.get('name').trim(),
                    pin: fd.get('pin').trim(),
                    hourlyRate: parseFloat(fd.get('hourlyRate')) || 45.00,
                    advanceBalance: parseFloat(fd.get('advanceBalance')) || 0.00
                };
                
                if (editingStaff) {
                    await updateDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION, editingStaff.id), data);
                    setEditingStaff(null);
                } else {
                    await addDoc(collection(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION), data);
                    setIsAddingStaff(false);
                }
            };

            const triggerDeleteStaff = (id, name) => {
                setConfirmState({
                    open: true,
                    title: "Delete Caretaker",
                    message: `Are you sure you want to permanently delete ${name}? All past shifts will remain recorded in database history.`,
                    isDanger: true,
                    confirmText: "Delete",
                    onConfirm: async () => {
                        await deleteDoc(doc(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION, id));
                        setConfirmState({ open: false });
                    }
                });
            };

            const handleImport = async (e) => {
                e.preventDefault();
                const csv = e.target.csv.value.trim();
                if (!csv) return;
                const lines = csv.split('\n');
                const batch = writeBatch(db);
                let count = 0;

                lines.forEach(line => {
                    const parts = line.split(',').map(s => s.trim());
                    if (parts.length >= 3) {
                        const dateStr = parts[0];
                        const name = parts[1];
                        const hours = parseFloat(parts[2]);
                        const note = parts[3] || '';
                        
                        if (!isNaN(hours)) {
                            const staffMatch = staff.find(s => s.name.toLowerCase() === name.toLowerCase());
                            const staffId = staffMatch ? staffMatch.id : `legacy_${name.replace(/\s+/g, '_')}`;
                            const rate = staffMatch ? staffMatch.hourlyRate : 45;

                            const startDt = new Date(dateStr);
                            if (!isNaN(startDt.getTime())) {
                                startDt.setHours(9, 0, 0, 0);
                                const endDt = new Date(startDt.getTime() + (hours * 60 * 60000));
                                const earned = Number((hours * rate).toFixed(2));

                                batch.set(doc(collection(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION)), {
                                    staffId,
                                    staffName: name,
                                    hourlyRateAtTime: rate,
                                    clockIn: startDt.toISOString(),
                                    clockOut: endDt.toISOString(),
                                    notes: note,
                                    paidTowards: earned,
                                    status: 'paid'
                                });
                                count++;
                            }
                        }
                    }
                });

                if (count > 0) {
                    await batch.commit();
                    setImportNotice({ type: 'success', text: `Successfully imported ${count} historical shift records.` });
                    e.target.reset();
                } else {
                    setImportNotice({ type: 'error', text: "Could not read any valid data rows. Check the format: Date, Name, Hours, Notes" });
                }
            };

            return (
                <div className="flex flex-col h-full bg-slate-100">
                    <header className="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shrink-0 shadow-md">
                        <div>
                            <h1 className="text-2xl font-black uppercase tracking-wide text-emerald-400">AmmaPay Admin</h1>
                            <p className="text-sm text-slate-300 font-bold">Mom's Complete Payroll & Timesheet Overview</p>
                        </div>
                        <button onClick={onLogout} className="flex items-center gap-2 px-4 py-2 bg-slate-800 hover:bg-slate-700 rounded-xl font-black text-base text-white transition-colors border border-slate-700">
                            <LogOut size={18} /> Exit Admin
                        </button>
                    </header>

                    {/* Navigation Tabs */}
                    <nav className="flex bg-white border-b-2 border-slate-300 shrink-0 shadow-xs overflow-x-auto">
                        <button onClick={() => setTab('payroll')} className={`px-6 py-4 text-base font-black uppercase tracking-wide border-b-4 whitespace-nowrap transition-colors flex items-center gap-2 ${tab === 'payroll' ? 'border-emerald-600 text-emerald-700 bg-emerald-50' : 'border-transparent text-slate-600 hover:bg-slate-100'}`}><DollarSign size={20}/> Unpaid Wages ({unpaidTotals.count})</button>
                        <button onClick={() => setTab('history')} className={`px-6 py-4 text-base font-black uppercase tracking-wide border-b-4 whitespace-nowrap transition-colors flex items-center gap-2 ${tab === 'history' ? 'border-blue-600 text-blue-700 bg-blue-50' : 'border-transparent text-slate-600 hover:bg-slate-100'}`}><History size={20}/> Payment Ledger ({payments.length})</button>
                        <button onClick={() => setTab('staff')} className={`px-6 py-4 text-base font-black uppercase tracking-wide border-b-4 whitespace-nowrap transition-colors flex items-center gap-2 ${tab === 'staff' ? 'border-indigo-600 text-indigo-700 bg-indigo-50' : 'border-transparent text-slate-600 hover:bg-slate-100'}`}><Users size={20}/> Caretakers ({staff.length})</button>
                        <button onClick={() => setTab('import')} className={`px-6 py-4 text-base font-black uppercase tracking-wide border-b-4 whitespace-nowrap transition-colors flex items-center gap-2 ${tab === 'import' ? 'border-amber-600 text-amber-700 bg-amber-50' : 'border-transparent text-slate-600 hover:bg-slate-100'}`}><FileUp size={20}/> Import Past Data</button>
                    </nav>

                    {/* Filter and Sorting Bar */}
                    {(tab === 'payroll' || tab === 'history') && (
                        <div className="bg-white border-b border-slate-300 px-6 py-3 shrink-0 flex flex-wrap items-center justify-between gap-4 shadow-xs">
                            <div className="flex flex-wrap items-center gap-4">
                                <div className="flex items-center gap-2">
                                    <Filter size={18} className="text-slate-500" />
                                    <span className="text-xs font-black uppercase text-slate-500 tracking-wider">Caretaker:</span>
                                    <select value={staffFilter} onChange={e => setStaffFilter(e.target.value)} className="bg-slate-100 border-2 border-slate-300 rounded-xl px-3 py-1.5 text-base font-black text-slate-800 outline-none focus:border-blue-500">
                                        <option value="ALL">All Caretakers</option>
                                        {staff.map(s => (
                                            <option key={s.id} value={s.id}>{s.name}</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="flex items-center gap-2">
                                    <Calendar size={18} className="text-slate-500" />
                                    <span className="text-xs font-black uppercase text-slate-500 tracking-wider">Month:</span>
                                    <select value={monthFilter} onChange={e => setMonthFilter(e.target.value)} className="bg-slate-100 border-2 border-slate-300 rounded-xl px-3 py-1.5 text-base font-black text-slate-800 outline-none focus:border-blue-500">
                                        <option value="ALL">All Months</option>
                                        {availableMonths.map(ym => (
                                            <option key={ym} value={ym}>{formatYearMonth(ym)}</option>
                                        ))}
                                    </select>
                                </div>
                            </div>

                            {tab === 'history' && (
                                <div className="flex flex-wrap items-center gap-3">
                                    <div className="flex bg-slate-200 p-1 rounded-xl">
                                        <button onClick={() => setHistoryGrouping('staff')} className={`px-3 py-1 text-sm font-black uppercase rounded-lg transition-colors ${historyGrouping === 'staff' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-600'}`}>By Caretaker</button>
                                        <button onClick={() => setHistoryGrouping('date')} className={`px-3 py-1 text-sm font-black uppercase rounded-lg transition-colors ${historyGrouping === 'date' ? 'bg-white text-blue-700 shadow-sm' : 'text-slate-600'}`}>By Date</button>
                                    </div>

                                    <div className="flex items-center gap-2">
                                        <ArrowUpDown size={18} className="text-slate-500" />
                                        <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="bg-slate-100 border-2 border-slate-300 rounded-xl px-3 py-1.5 text-sm font-black text-slate-800 outline-none focus:border-blue-500">
                                            <option value="date_desc">Newest First</option>
                                            <option value="date_asc">Oldest First</option>
                                            <option value="pay_desc">Highest Pay</option>
                                            <option value="pay_asc">Lowest Pay</option>
                                        </select>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}

                    {/* Main Content Area */}
                    <div className="flex-1 overflow-y-auto p-6 flex justify-center">
                        <div className="w-full max-w-4xl space-y-6">

                            {/* UNPAID PAYROLL TAB */}
                            {tab === 'payroll' && (
                                <div className="space-y-6">
                                    {/* Overall Unpaid Totals Banner */}
                                    <div className="bg-gradient-to-r from-emerald-600 to-teal-700 text-white rounded-2xl p-6 shadow-md flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
                                        <div>
                                            <p className="text-emerald-200 text-sm font-black uppercase tracking-wider">Total Due</p>
                                            <h2 className="text-4xl font-black tracking-tight">${unpaidTotals.dollars.toFixed(2)}</h2>
                                        </div>
                                        <div className="flex gap-4">
                                            <div className="bg-white/15 px-4 py-2.5 rounded-xl border border-white/20">
                                                <p className="text-emerald-200 text-xs font-black uppercase tracking-wider">Unpaid Hours</p>
                                                <p className="text-2xl font-black">{unpaidTotals.formattedHours}</p>
                                            </div>
                                            <div className="bg-white/15 px-4 py-2.5 rounded-xl border border-white/20">
                                                <p className="text-emerald-200 text-xs font-black uppercase tracking-wider">Unpaid Shifts</p>
                                                <p className="text-2xl font-black">{unpaidTotals.count}</p>
                                            </div>
                                        </div>
                                    </div>

                                    {payrollByStaff.length === 0 && (
                                        <div className="p-10 text-center bg-white border-2 border-dashed border-slate-300 rounded-2xl space-y-2">
                                            <p className="text-2xl font-black text-slate-700">Everyone is fully paid up!</p>
                                            <p className="text-base text-slate-500 font-semibold">There are no pending shift wages matching this filter.</p>
                                        </div>
                                    )}
                                    
                                    {payrollByStaff.map(person => {
                                        const hasActiveAdvance = person.advanceBalance > 0;

                                        return (
                                            <div key={person.id} className="bg-white rounded-2xl border-2 border-slate-200 shadow-sm overflow-hidden">
                                                <div className="p-5 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-start sm:items-center bg-slate-50/90 gap-4">
                                                    <div>
                                                        <div className="flex items-center gap-3">
                                                            <h3 className="text-2xl font-black text-slate-900">{person.name}</h3>
                                                            <button 
                                                                onClick={() => setAdvanceModalStaff(person)} 
                                                                className="px-2.5 py-1 bg-purple-100 hover:bg-purple-200 text-purple-900 rounded-lg text-xs font-black uppercase tracking-wider transition-colors flex items-center gap-1"
                                                                title="Issue a cash advance to this caretaker"
                                                            >
                                                                <Wallet size={14}/> + Issue Advance
                                                            </button>
                                                        </div>
                                                        {hasActiveAdvance && (
                                                            <div className="mt-2 inline-flex items-center gap-1.5 px-3 py-1 bg-amber-100 border border-amber-300 rounded-xl text-amber-900 text-xs font-black uppercase tracking-wide">
                                                                <AlertCircle size={15}/> Advance: ${person.advanceBalance.toFixed(2)}
                                                            </div>
                                                        )}
                                                    </div>
                                                    <div className="text-left sm:text-right bg-emerald-50 px-5 py-3 rounded-2xl border-2 border-emerald-300">
                                                        <div className="text-xs font-black text-emerald-700 uppercase tracking-wider">Unpaid Shift Wages Due</div>
                                                        <div className="text-3xl font-black text-emerald-800 tracking-tight">${person.totalRemainingDue.toFixed(2)}</div>
                                                        <div className="text-sm font-bold text-emerald-700">{formatMinutesToHours(person.totalMins)} ({person.shifts.length} shift{person.shifts.length !== 1 ? 's' : ''})</div>
                                                    </div>

                                    <div className="flex-1 flex gap-2">
                                        <button type="button" onClick={() => setEditingShiftAdmin(null)} className="flex-1 py-3 bg-slate-200 hover:bg-slate-300 rounded-xl font-black text-base text-slate-700 uppercase">Cancel</button>
                                        <button type="submit" className="flex-1 py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-black text-base uppercase shadow-md">Save Changes</button>
                                    </div>
                                </div>
                            </form>
                        </Modal>
                    )}

                    {/* CARETAKER ADD/EDIT MODAL */}
                    {(isAddingStaff || editingStaff) && (
                        <Modal title={editingStaff ? `Edit ${editingStaff.name}` : "Add New Caretaker"} onClose={() => { setIsAddingStaff(false); setEditingStaff(null); }}>
                            <form onSubmit={handleSaveStaff} className="space-y-4">
                                <div>
                                    <label className="block text-sm font-black uppercase text-slate-700 tracking-wide mb-1">Caretaker Full Name</label>
                                    <input autoFocus required name="name" type="text" defaultValue={editingStaff ? editingStaff.name : ''} className="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-4 py-2.5 text-lg font-bold outline-none focus:border-indigo-500" placeholder="e.g. Maria Johnson" />
                                </div>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-black uppercase text-slate-700 tracking-wide mb-1">Secret PIN (4 Digits)</label>
                                        <input required name="pin" type="text" pattern="\d{4}" maxLength="4" defaultValue={editingStaff ? editingStaff.pin : ''} className="w-full bg-slate-50 border-2 border-slate-300 rounded-xl px-4 py-2.5 text-2xl font-black tracking-widest text-center outline-none focus:border-indigo-500" placeholder="0000" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-black uppercase text-slate-700 tracking-wide mb-1">Hourly Wage ($/hr)</label>
                                        <div className="relative">
                                            <span className="absolute left-3 top-2.5 text-xl font-black text-slate-400">$</span>
                                            <input required name="hourlyRate" type="number" step="0.01" defaultValue={editingStaff ? editingStaff.hourlyRate : 45.00} className="w-full bg-emerald-50 text-emerald-800 border-2 border-emerald-300 rounded-xl pl-9 pr-3 py-2 text-xl font-black outline-none focus:border-emerald-600" />
                                        </div>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-black uppercase text-slate-700 tracking-wide mb-1">Active Advance Balance ($)</label>
                                    <input name="advanceBalance" type="number" step="0.01" defaultValue={editingStaff ? (editingStaff.advanceBalance || editingStaff.prepaidCredit || 0) : 0} className="w-full bg-slate-50 text-slate-900 border-2 border-slate-300 rounded-xl px-4 py-2.5 text-lg font-bold outline-none focus:border-indigo-500" />
                                    <p className="text-slate-500 text-xs font-bold mt-1">If this caretaker owes money from a previous advance, enter it here.</p>
                                </div>
                                <div className="pt-3 flex gap-3 border-t border-slate-100">
                                    <button type="button" onClick={() => { setIsAddingStaff(false); setEditingStaff(null); }} className="flex-1 py-3 bg-slate-200 hover:bg-slate-300 rounded-xl font-black text-base text-slate-700 uppercase">Cancel</button>
                                    <button type="submit" className="flex-1 py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-black text-base uppercase shadow-md">Save Caretaker</button>
                                </div>
                            </form>
                        </Modal>
                    )}

                    {/* CONFIRM MODAL */}
                    <ConfirmModal 
                        open={confirmState.open}
                        title={confirmState.title}
                        message={confirmState.message}
                        confirmText={confirmState.confirmText}
                        isDanger={confirmState.isDanger}
                        onConfirm={confirmState.onConfirm}
                        onCancel={() => setConfirmState({ open: false })}
                    />
                </div>
            );
        }

        function PaymentCalculationModal({ staffGroup, onSubmit, onClose }) {
            const hasAdvance = staffGroup.advanceBalance > 0;
            const [shiftWagePay, setShiftWagePay] = useState(staffGroup.totalRemainingDue);
            const [repaymentAmt, setRepaymentAmt] = useState(0);

            const netDisbursed = Math.max(0, shiftWagePay - repaymentAmt);
            const remainingAdvanceAfter = Math.max(0, staffGroup.advanceBalance - repaymentAmt);

            return (
                <Modal title={`Pay ${staffGroup.staffName}`} onClose={onClose}>
                    <form onSubmit={onSubmit} className="space-y-5">
                        <div className="bg-emerald-50 p-4 rounded-2xl border-2 border-emerald-200 space-y-1">
                            <p className="text-xs font-black uppercase tracking-wider text-emerald-800">Owed</p>
                            <p className="text-3xl font-black text-emerald-900">${staffGroup.totalRemainingDue.toFixed(2)}</p>
                            <p className="text-sm font-bold text-emerald-700">Total earned across {staffGroup.shifts.length} shift(s)</p>
                        </div>

                        {/* Shift Wages to Pay Out */}
                        <div>
                            <label className="block text-sm font-black uppercase text-slate-700 tracking-wide mb-1">
                                Pay Now
                            </label>
                            <div className="relative">
                                <span className="absolute left-4 top-3 text-2xl font-black text-slate-400">$</span>
                                <input 
                                    autoFocus 
                                    required 
                                    name="shiftWagePay" 
                                    type="number" 
                                    step="0.01" 
                                    value={shiftWagePay}
                                    onChange={e => setShiftWagePay(parseFloat(e.target.value) || 0)}
                                    className="w-full bg-slate-50 text-slate-900 border-2 border-slate-300 rounded-xl pl-10 pr-4 py-3 text-2xl font-black outline-none focus:border-emerald-600" 
                                />
                            </div>
                        </div>

                        {/* REPAYMENT SECTION: ONLY VISIBLE IF THERE IS AN ACTIVE ADVANCE */}
                        {hasAdvance && (
                            <div className="bg-amber-50 p-4 rounded-2xl border-2 border-amber-300 space-y-3">
                                <div className="flex justify-between items-center">
                                    <span className="text-xs font-black uppercase text-amber-900 tracking-wider">Advance Balance</span>
                                    <span className="text-base font-black text-amber-900">${staffGroup.advanceBalance.toFixed(2)}</span>
                                </div>

                                <div>
                                    <label className="block text-xs font-black uppercase text-amber-900 tracking-wide mb-1">
                                        Repayment from Pay
                                    </label>
                                    <div className="relative">
                                        <span className="absolute left-3 top-2 text-xl font-black text-amber-500">$</span>
                                        <input 
                                            name="repaymentAmount" 
                                            type="number" 
                                            step="0.01" 
                                            max={Math.min(shiftWagePay, staffGroup.advanceBalance)}
                                            value={repaymentAmt}
                                            onChange={e => setRepaymentAmt(Math.min(parseFloat(e.target.value) || 0, staffGroup.advanceBalance))}
                                            className="w-full bg-white text-amber-950 border-2 border-amber-300 rounded-xl pl-8 pr-3 py-2 text-xl font-black outline-none focus:border-amber-600" 
                                        />
                                    </div>
                                </div>

                                {repaymentAmt > 0 && (
                                    <div className="text-xs font-bold text-amber-900 bg-white/70 p-2 rounded-lg">
                                        Advance remaining after this payment: <strong>${remainingAdvanceAfter.toFixed(2)}</strong>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* FINAL DISBURSEMENT SUMMARY */}
                        <div className="bg-slate-100 p-4 rounded-xl flex justify-between items-center">
                            <div>
                                <p className="text-xs font-black uppercase text-slate-500">Total Paid</p>
                                <p className="text-sm font-bold text-slate-600">After any repayment</p>
                            </div>
                            <div className="text-3xl font-black text-emerald-700">
                                ${netDisbursed.toFixed(2)}
                            </div>
                        </div>

                        <div>
                            <label className="block text-sm font-black uppercase text-slate-700 tracking-wide mb-1">
                                Note
                            </label>
                            <input 
                                name="paymentNotes" 
                                type="text" 
                                placeholder="e.g. Check #104, Paid cash" 
                                className="w-full bg-slate-50 text-slate-900 border-2 border-slate-300 rounded-xl px-4 py-3 text-base font-bold outline-none focus:border-emerald-600" 
                            />
                        </div>

                        <div className="pt-3 flex gap-3 border-t border-slate-100">
                            <button type="button" onClick={onClose} className="flex-1 py-3.5 bg-slate-200 hover:bg-slate-300 rounded-xl font-black text-lg text-slate-700 uppercase">Cancel</button>
                            <button type="submit" className="flex-1 py-3.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-black text-lg uppercase shadow-md">Record Payment</button>
                        </div>
                    </form>
                </Modal>
            );
        }

        function App() {
            const [authLoaded, setAuthLoaded] = useState(false);
            const [user, setUser] = useState(null);
            const [staff, setStaff] = useState([]);
            const [shifts, setShifts] = useState([]);
            const [payments, setPayments] = useState([]);
            const [pinError, setPinError] = useState('');
            const [dbError, setDbError] = useState('');

            useEffect(() => {
                const initApp = async () => {
                    try {
                        if (!auth.currentUser) {
                            const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                            let signedIn = false;
                            if (token) {
                                try {
                                    await signInWithCustomToken(auth, token);
                                    signedIn = true;
                                } catch (tokenErr) {
                                    console.warn("Custom token mismatch; falling back to anonymous auth:", tokenErr);
                                }
                            }
                            if (!signedIn) {
                                await signInAnonymously(auth);
                            }
                        }

                        // Realtime listeners on permanent collections
                        onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', STAFF_COLLECTION), (snap) => {
                            setStaff(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }, (err) => {
                            setDbError("Database Connection Issue: " + err.message);
                        });

                        onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', SHIFTS_COLLECTION), (snap) => {
                            setShifts(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }, (err) => {
                            setDbError("Database Connection Issue: " + err.message);
                        });

                        onSnapshot(collection(db, 'artifacts', APP_ID, 'public', 'data', PAYMENTS_COLLECTION), (snap) => {
                            setPayments(snap.docs.map(d => ({ id: d.id, ...d.data() })));
                        }, (err) => {
                            setDbError("Database Connection Issue: " + err.message);
                        });

                        setAuthLoaded(true);
                    } catch (err) {
                        console.error("Firebase Init Error:", err);
                        setDbError("Database Error: " + err.message);
                        setAuthLoaded(true);
                    }
                };
                initApp();
            }, []);

            const handleLogin = (pin) => {
                setPinError('');
                if (pin === ADMIN_PIN) {
                    setUser({ role: 'admin' });
                } else {
                    const found = staff.find(s => s.pin === pin);
                    if (found) {
                        setUser({ role: 'staff', ...found });
                    } else {
                        setPinError("Invalid PIN. Please try again.");
                    }
                }
            };

            const handleLogout = () => {
                setPinError('');
                setUser(null);
            };

            if (!authLoaded) {
                return (
                    <div className="flex h-screen items-center justify-center font-black text-xl text-slate-500 uppercase tracking-widest animate-pulse">
                        Loading Database...
                    </div>
                );
            }

            return (
                <div className="h-full w-full flex flex-col justify-center">
                    {dbError && (
                        <div className="bg-red-600 text-white p-3 font-black text-center text-base shrink-0">
                            {dbError}
                        </div>
                    )}
                    {!user ? (
                        <PinPad onPinComplete={handleLogin} errorMessage={pinError} />
                    ) : user.role === 'admin' ? (
                        <AdminDashboard staff={staff} shifts={shifts} payments={payments} onLogout={handleLogout} />
                    ) : (
                        <CaretakerDashboard user={user} shifts={shifts} onLogout={handleLogout} />
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
